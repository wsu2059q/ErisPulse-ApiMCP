[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ErisPulse-ApiMCP"
version = "0.1.0"
description = "ErisPulse MCP 网关模块 - 将 ErisPulse 运行时能力(收发消息/模块调用/适配器管理/事件流)经 Model Context Protocol 开放给 AI 客户端"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [ { name = "ErisPulse EcoDev" } ]
dependencies = [
    "ErisPulse>=2.11",
    "mcp>=1.0",
]

[project.urls]
"homepage" = "https://github.com/wsu2059q/ErisPulse-ApiMCP"
"repository" = "https://github.com/wsu2059q/ErisPulse-ApiMCP"

[project.entry-points."erispulse.module"]
"ApiMCP" = "ErisPulse_ApiMCP:Main"

[project.scripts]
erispulse-apimcp = "ErisPulse_ApiMCP.server:main"

[tool.setuptools]
packages = ["ErisPulse_ApiMCP"]

[dependency-groups]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.uv]
default-groups = ["test"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
